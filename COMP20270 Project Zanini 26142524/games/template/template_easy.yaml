# ==========================================
# GAME METADATA & SETUP
# ==========================================
# Data needed for the GamePicker
game_metadata: 
  name: "" # string
  cover_art: "" # filepath in the game file directory

game_config:
  player_config:
    player_range:
      minimum: 1 # Integer > 0 
      maximum: 10 # Integer > minimum
  
#   team_config: 
#     teams_enabled: # true, false
#     team_size: # int
#     unbalanced_team_size_resolution: "set" # set, random, refuse
  
  dealer: 
    dealer_enabled: false # Options: true, false
#     dealer_player: false # Defines if the dealer is a player, and what their r
#     dealer_rotates: #
#     dealer_strategy: # Options: "safe", "greedy", "custom" - custom py file must be as DealerStrategy.py

# valid_strategies: []

# # ==========================================
# # DECK & CARD DEFINITIONS
# # ==========================================
# # Can this actually deal with more complex card games where you might have lots of different effect cards & special cards that don't match the value, suit paradigm? 
deck_constructor:
#   # Multiplier for the card_array 
#   # You can enter an int (ie. 1, 2) or a dictionary where the key is the number of decks, and the values are the player counts corresponding to that number of players.
#   # ie. {1:[1,2,3,4], 2:[5,6,7,8]}
  number_of_decks: 1
  visible: true # Bool
  
  legal_cards:
    # Map card string names to integer weights (e.g., "Ace": 1, "King": 13)
    card_names: {}
      
    # Map suit string names to integer IDs (e.g., "Spades": 1, "Heart": 2)
    card_suits: {}
    
  # Format: "One card for each value and name", [[card_value, suit_id], [card_value, suit_id], ...]
  card_array: [
            [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [8, 1], [9, 1], [10, 1], [11, 1], [12, 1], [13, 1],
            [1, 2], [2, 2], [3, 2], [4, 2], [5, 2], [6, 2], [7, 2], [8, 2], [9, 2], [10, 2], [11, 2], [12, 2], [13, 2],
            [1, 3], [2, 3], [3, 3], [4, 3], [5, 3], [6, 3], [7, 3], [8, 3], [9, 3], [10, 3], [11, 3], [12, 3], [13, 3],
            [1, 4], [2, 4], [3, 4], [4, 4], [5, 4], [6, 4], [7, 4], [8, 4], [9, 4], [10, 4], [11, 4], [12, 4], [13, 4]
            ]

